<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <!-- Navy bracket frame -->
  <rect x="30" y="20" width="140" height="140" rx="8" fill="#1e3a5f"/>
  <!-- Inner white cutout (bracket shape) -->
  <rect x="52" y="42" width="96" height="96" rx="4" fill="white"/>
  <!-- Left bracket leg cutout -->
  <rect x="52" y="42" width="28" height="96" rx="0" fill="white"/>
  <!-- Right bracket leg cutout -->
  <rect x="120" y="42" width="28" height="96" rx="0" fill="white"/>
  <!-- Center cutout (between bracket legs) -->
  <rect x="80" y="70" width="40" height="68" rx="0" fill="white"/>

  <!-- Tie - navy knot top -->
  <polygon points="100,48 88,72 112,72" fill="#1e3a5f"/>
  <!-- Tie - gray body -->
  <polygon points="88,72 112,72 108,130 100,145 92,130" fill="#6b7280"/>
  <!-- Tie - gray stripe highlights -->
  <polygon points="90,90 110,90 109,98 91,98" fill="#9ca3af" opacity="0.7"/>
  <polygon points="91,104 109,104 108,112 92,112" fill="#9ca3af" opacity="0.5"/>
</svg>
