server:
  port: 8082
  servlet:
    context-path: /

spring:
  application:
    name: job-portal-backend

  data:
    mongodb:
      host: localhost
      port: 27017
      database: jobportal

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

  # ── Gmail SMTP — enabled ──────────────────────────────────────
  mail:
    host: smtp.gmail.com
    port: 587
    username: gldurgaprasad2005@gmail.com
    password: vadkdvpeqitdxher
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

jwt:
  secret: jobPortalSecret2024_VeryLongKey_ForHMACSHA256_AtLeast32Chars
  expiration: 86400000
  refresh-expiration: 604800000

file:
  upload-dir: ./uploads
  resume-dir: ./uploads/resumes
  logo-dir: ./uploads/logos

logging:
  level:
    com.jobportal: DEBUG
    org.springframework.security: INFO
    org.springframework.data.mongodb: INFO
    org.springframework.mail: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

cors:
  allowed-origins: http://localhost:3000,http://localhost:3001,http://localhost:5173
